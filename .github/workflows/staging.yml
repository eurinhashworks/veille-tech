name: Staging Validation

on:
  push:
    branches: ["main"]

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (Vitest)
        run: pnpm run test -- --coverage

      - name: Prisma validate & migrations status
        run: |
          pnpm run prisma:validate
          pnpm exec prisma migrate status

      - name: Build
        run: pnpm run build

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start dev servers (background)
        run: |
          nohup pnpm run dev >/dev/null 2>&1 &
          for i in {1..60}; do
            if curl -sSf http://localhost:5173 >/dev/null; then echo "Server up"; break; fi
            sleep 1
          done

      - name: E2E smoke tests (Playwright)
        run: pnpm run test:e2e

      - name: Security audit (production dependencies)
        run: pnpm run audit
